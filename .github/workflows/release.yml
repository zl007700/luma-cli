name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload skills bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          zip -r "luma-skills-${GITHUB_REF_NAME}.zip" skills docs/SKILLS.md
          gh release upload "${GITHUB_REF_NAME}" "luma-skills-${GITHUB_REF_NAME}.zip" --clobber

  publish-npm:
    needs: goreleaser
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" --pattern checksums.txt --dir .
          test -s checksums.txt

      - name: Publish to npm
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          test "${TAG_VERSION}" = "${PKG_VERSION}"
          node --version
          npm --version
          PKG_NAME="$(node -p "require('./package.json').name")"
          if [[ "${PKG_NAME}" == @*/* ]]; then
            npm publish --access public --tag latest
          else
            npm publish --tag latest
          fi
