version: 2

builds:
  - binary: luma-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/luma-cli/lumer-cli/internal/commands.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - name_template: "luma-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - README.en.md
      - LICENSE
      - SECURITY.md
      - CONTRIBUTING.md
      - CODE_OF_CONDUCT.md

checksum:
  name_template: checksums.txt

release:
  replace_existing_artifacts: true
  mode: replace

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
